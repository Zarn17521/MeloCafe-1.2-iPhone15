name: MeloCafe v1.2 iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iPhone ARM64 IPA
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout uploaded source parts
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData/"* || true
          rm -rf "$HOME/Library/Caches/"* || true
          rm -rf "$HOME/Library/Developer/CoreSimulator/Caches/"* || true
          echo "Disk space after cleanup:"
          df -h "$RUNNER_TEMP"

      - name: Reassemble and extract source
        run: |
          set -euo pipefail
          WORK_DIR="$RUNNER_TEMP/melocafe-build"
          SOURCE_DIR="$WORK_DIR/source"
          mkdir -p "$SOURCE_DIR"
          cat "$GITHUB_WORKSPACE"/source.part* > "$WORK_DIR/source.zip"
          echo "Archive size:"
          ls -lh "$WORK_DIR/source.zip"
          echo "Available disk space:"
          df -h "$RUNNER_TEMP"
          python3 - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          archive = Path(os.environ["RUNNER_TEMP"]) / "melocafe-build" / "source.zip"
          destination = Path(os.environ["RUNNER_TEMP"]) / "melocafe-build" / "source"
          root = destination.resolve()
          with zipfile.ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"ZIP integrity check failed at: {bad!r}")
              for info in zf.infolist():
                  # Strip two invisible right-to-left marks in the archive filename.
                  name = info.filename.replace("\\u200f", "")
                  target = (destination / name).resolve()
                  if os.path.commonpath([str(root), str(target)]) != str(root):
                      raise SystemExit(f"Unsafe ZIP path: {info.filename!r}")
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(info) as src, open(target, "wb") as dst:
                          while True:
                              chunk = src.read(1024 * 1024)
                              if not chunk:
                                  break
                              dst.write(chunk)
          PY
          rm -f "$WORK_DIR/source.zip"
          PROJECT="$(find "$SOURCE_DIR" -name MeloCafe.xcodeproj -print -quit)"
          test -n "$PROJECT" || { echo "MeloCafe.xcodeproj not found after extraction" >&2; exit 1; }
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Extracted project: $PROJECT"
          df -h "$RUNNER_TEMP"

      - name: Prepare Cemu iOS framework project
        run: |
          set -euo pipefail
          ROOT="$(dirname "$(dirname "$PROJECT")")"
          echo "Cemu source root: $ROOT"
          # The uploaded source archive does not contain Git submodule contents.
          while read -r key path; do
            name="${key#submodule.}"
            name="${name%.path}"
            url="$(git config -f "$ROOT/.gitmodules" "submodule.$name.url")"
            if [ -n "$url" ]; then
              rm -rf "$ROOT/$path"
              mkdir -p "$(dirname "$ROOT/$path")"
              echo "Cloning $name from $url"
              git clone --depth 1 "$url" "$ROOT/$path"
            fi
          done < <(git config -f "$ROOT/.gitmodules" --get-regexp '^submodule\\..*\\.path
      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme MeloCafe

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme MeloCafe \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            PRODUCT_BUNDLE_IDENTIFIER=com.zarn17521.MeloCafe \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/MeloCafe.app"
          test -d "$APP" || { echo "MeloCafe.app was not produced" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/MeloCafe.app"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/MeloCafe-v1.2-iOS-unsigned.ipa" Payload)
          ls -lh "$GITHUB_WORKSPACE/MeloCafe-v1.2-iOS-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeloCafe-v1.2-iOS-unsigned
          path: MeloCafe-v1.2-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
)
          cmake -S "$ROOT" -B "$ROOT/build" -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_VCPKG=ON
          test -d "$ROOT/build/Cemu.xcodeproj" || {
            echo "CMake did not generate build/Cemu.xcodeproj" >&2
            exit 1
          }
          echo "Cemu Xcode project generated successfully."

      - name: Inspect Xcode project
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -list -project "$PROJECT"

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme MeloCafe

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme MeloCafe \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            PRODUCT_BUNDLE_IDENTIFIER=com.zarn17521.MeloCafe \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/MeloCafe.app"
          test -d "$APP" || { echo "MeloCafe.app was not produced" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/MeloCafe.app"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/MeloCafe-v1.2-iOS-unsigned.ipa" Payload)
          ls -lh "$GITHUB_WORKSPACE/MeloCafe-v1.2-iOS-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeloCafe-v1.2-iOS-unsigned
          path: MeloCafe-v1.2-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
